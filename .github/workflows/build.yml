# Builds the image from the Strata tag in build/STRATA_VERSION on every push (merge) to main, and
# pushes ghcr.io/williamkunz/strata:<tag> and :latest.
name: Build image

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360          # the hosted-runner maximum; the engine compiles for five GPU generations
    steps:
      - uses: actions/checkout@v4

      # a broken template or profile would reach Community Applications from main before anyone notices
      - name: Template and profile are valid
        run: |
          python3 - <<'EOF'
          import xml.etree.ElementTree as ET
          for f in ("templates/strata.xml", "ca_profile.xml"):
              ET.parse(f)
          repo = ET.parse("templates/strata.xml").findtext("Repository")
          if repo != "ghcr.io/williamkunz/strata:latest":
              raise SystemExit(f"::error file=templates/strata.xml::<Repository> is {repo}, expected the image this workflow pushes")
          EOF

      # the CUDA devel base image plus the build need more than the runner's ~14 GB free
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build${{ github.event_name == 'push' && ' and push' || '' }}
        env:
          PUSH: ${{ github.event_name == 'push' && '1' || '0' }}
        run: bash build/build.sh
